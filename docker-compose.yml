services:
  db:
    image: postgis/postgis:17-3.5
    container_name: lostfound-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lostfound}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lostfound}
      POSTGRES_DB: ${DB_NAME:-lostfound}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
